org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# RIMOSSO android.enableJetifier: deprecato e non piu' necessario (tutte le
# dipendenze sono gia' AndroidX).
# RIMOSSO DAVVERO (2.5.1) android.builtInKotlin=false: era stato rimesso da
# un tool di migrazione Flutter dopo essere stato tolto, contraddicendo il
# commento sopra. Con AGP 9 il Built-in Kotlin e' il default e questo
# progetto e' gia' migrato (niente piu' plugin kotlin-android). Se
# `flutter pub get`/migrate lo rimette da solo, va tolto di nuovo.
# newDsl=false resta: mantiene i tipi DSL legacy usati dal Flutter Gradle
# Plugin; verra' rimosso quando Flutter completera' la transizione.
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
