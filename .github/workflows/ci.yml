# Controlli automatici su ogni push/PR verso main.
# Volutamente NON firma e NON pubblica niente: quello lo fa release.yml sui tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un solo job in coda per branch: un push nuovo annulla il run precedente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Unico punto in cui bumpare la versione di Flutter (allineata a release.yml).
  FLUTTER_VERSION: '3.44.7'

jobs:
  analyze:
    name: Analyze, traduzioni e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - run: flutter --version

      - name: Dipendenze
        run: flutter pub get

      - name: Le traduzioni generate sono aggiornate?
        # I file lib/l10n/app_localizations*.dart sono versionati: se qualcuno
        # modifica gli .arb senza rigenerarli, l'app compilata resta indietro.
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n; then
            echo "::error::I file di traduzione generati non sono aggiornati. Esegui 'flutter gen-l10n' e committa lib/l10n."
            git diff --stat -- lib/l10n
            exit 1
          fi

      - name: Analisi statica
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    # Serve a scoprire subito una rottura della toolchain Android
    # (AGP 9.0.1 / Gradle 9.1 / Built-in Kotlin), senza aspettare il tag.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # AGP 9.0 richiede JDK 17 minimo (ed e' anche il default).
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Dipendenze
        run: flutter pub get

      - name: Build APK di debug
        # Debug: nessun keystore, nessun secret. Verifica solo che compili.
        run: flutter build apk --debug
